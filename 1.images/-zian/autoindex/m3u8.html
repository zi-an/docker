<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>视频</title>
    <link href="/bootstrap.min.css" rel="stylesheet">
    <link href="/my.css" rel="stylesheet">
</head>

<body style="font-size:39px">
<form action="/api/m3u8" class="mb-1" method="post">
    <label style="width: 100%">
        <input class="form-control form-control-lg" name="uri" placeholder="下载地址" required="required"/>
        <input class="form-control form-control-lg" name="name" placeholder="文件名称" required="required"/>
    </label>
    <input class="btn btn-lg btn-light" style="width:100%" type="submit" value="下载">
</form>

<div class="panel panel-default">
    <table class="table table-striped table-hover" id="load">
    </table>
</div>
</body>
<script type="text/javascript">
    let data;
    baseUrl = "/json" + window.location.pathname

    fetch(baseUrl)
        .then(response => response.json())
        .then(response => {
                data = response;
                loadData();
            }
        )

    function loadData() {
        let result = ``;

        // 添加返回上级目录链接
        result += `
            <tr>
                <td><a href="${parentDirectory(window.location.pathname)}">...</a></td>
                <td></td>
            </tr>
        `;

        // 遍历数据生成表格行
        for (let i = 0; i < data.length; i++) {
            const item = data[i];
            result += '<tr>';

            if (item.type === 'directory') {
                // 处理目录
                const url = normalizeUrl(window.location.pathname + '/' + item.name + '/');
                result += `<td><a href="${url}">./${item.name}/</a></td>`;
            } else {
                // 处理文件
                const url = baseUrl + item.name;
                result += `<td><a href="${url}" class="d-inline-block me-2 text-truncate" style="max-width: 70%;">${item.name}</a><small class="text-muted align-middle">${formatFileSize(item.size)}</small></td>`;
            }

            result += `<td>${dateFormat(item.mtime)}</td>`;
            result += '</tr>';
        }

        document.getElementById("load").innerHTML = result;
    }

    // 辅助函数：标准化URL
    function normalizeUrl(url) {
        return url.replace(/\/+/g, '/');
    }

    // 辅助函数：格式化文件大小
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    //时间排序
    function sort() {
        data.sort((a, b) => {
            if (a.type === b.type) {
                return new Date(b.mtime) - new Date(a.mtime);
            }
            return a.type.localeCompare(b.type);
        })
        loadData();
    }


    /*返回格式化时间*/
    function dateFormat(unixTimestamp) {
        const date = new Date(unixTimestamp);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    /* 返回上级目录,若当前为根目录则返回当前*/
    function parentDirectory(from) {
        let result = from.slice(0, from.lastIndexOf('\/'));
        result = result.slice(0, result.lastIndexOf('\/')) + '\/';
        if (result.indexOf('\/') !== 0) {
            return "/";
        } else {
            return result;
        }
    }
</script>
</html>
