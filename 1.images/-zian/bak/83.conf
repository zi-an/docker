proxy_cache_path ./cache levels=1:2 keys_zone=cache:20m;
server {
    listen 83;
    proxy_ssl_server_name on;

    location / {
        proxy_pass https://sukebei.moonchan.xyz;
        proxy_set_header Host sukebei.moonchan.xyz;

        # 缓存设置（仅静态资源）
        proxy_cache cache;
        proxy_cache_key "$scheme$proxy_host$request_uri$is_args$args";

        # 缓存有效期
        proxy_cache_valid 200 301 302 7d;      # 静态资源：7 天
        proxy_cache_valid 404 10m;              # 404：10 分钟
        proxy_cache_valid any 1h;               # 其他状态：1 小时

        # 缓存行为
        proxy_cache_methods GET HEAD;           # 仅缓存 GET/HEAD 请求
        proxy_cache_min_uses 1;                 # 1 次访问即缓存
        proxy_cache_revalidate on;              # 过期后异步回源更新
        proxy_cache_use_stale error timeout updating http_500 http_502;
        proxy_cache_bypass $http_cache_control; # 绕过带 Cache-Control: no-cache 的请求
        proxy_no_cache $http_authorization;     # 不缓存带 Authorization 头的请求

        # 静态资源添加 Cache-Control 头
        if ($request_uri ~* \.(js|css|png|jpg|jpeg|gif|ico)$) {
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # 调试头（上线后注释）
        # add_header X-Cache-Status $upstream_cache_status;
    }
}