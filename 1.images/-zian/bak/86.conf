server {
     listen 86;

     # 通用代理头
     proxy_set_header Host              chatjimmy.ai;
     proxy_set_header X-Real-IP         $remote_addr;
     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $scheme;
     proxy_set_header Connection        "";

     proxy_http_version 1.1;

     # 定义缓存区域（需在 http 块中定义，此处为示例）
     # proxy_cache_path /path/to/cache levels=1:2 keys_zone=cache:10m inactive=30d max_size=1g use_temp_path=off;

     # 动态代理：/api/chat 路径（实时转发，不缓存）
     location /api/chat {
         proxy_pass https://chatjimmy.ai;

         # 禁用缓存，保证实时性
         proxy_cache_bypass $http_pragma $http_authorization;
         proxy_no_cache $http_pragma $http_authorization;
         proxy_ignore_headers Cache-Control Expires Set-Cookie;

         # 超时与缓冲
         proxy_connect_timeout 30s;
         proxy_send_timeout    60s;
         proxy_read_timeout    60s;
         proxy_buffering       on;
         proxy_buffer_size     4k;
         proxy_buffers         8 4k;

         # WebSocket 支持
         proxy_set_header Upgrade    $http_upgrade;
         proxy_set_header Connection "upgrade";
     }

     # 缓存 /api/health 路径（例如缓存 5 分钟）
     location /api/health {
         proxy_pass https://chatjimmy.ai;

         # 启用缓存
         proxy_cache cache;
         proxy_cache_key "$scheme://$host$request_uri";
         proxy_cache_valid 200 5m;  # 缓存 5 分钟
         proxy_cache_valid 404 1m;
         proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
         proxy_cache_lock on;

         # 客户端缓存
         expires 5m;
         add_header Cache-Control "public, must-revalidate";

         # 忽略后端 Set-Cookie（可选）
         proxy_ignore_headers Set-Cookie;
         proxy_hide_header Set-Cookie;
     }

     # 静态代理：其他所有路径（启用 30 天缓存）
     location / {
         proxy_pass https://chatjimmy.ai;

         # 启用 30 天静态缓存
         proxy_cache cache;
         proxy_cache_key "$scheme://$host$request_uri";
         proxy_cache_valid 200 30d;  # 缓存 30 天
         proxy_cache_valid 404 5m;
         proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
         proxy_cache_lock on;

         # 缓存状态头（调试用）
         add_header X-Cache-Status $upstream_cache_status;

         # 静态资源优化
         expires 30d;
         add_header Cache-Control "public, immutable";

         # 忽略后端 Set-Cookie（静态资源不需要）
         proxy_ignore_headers Set-Cookie;
         proxy_hide_header Set-Cookie;
     }

     # 禁止访问隐藏文件
     location ~ /\. {
         deny all;
         access_log off;
         log_not_found off;
     }
 }