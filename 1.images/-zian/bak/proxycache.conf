proxy_cache_path proxycache levels=1:2 keys_zone=proxycache:10m max_size=5g inactive=30d use_temp_path=off;

server {
    listen 81;

    location / {
        proxy_pass https://sukebei.moonchan.xyz;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        # ============ 缓存核心配置 ============
        proxy_cache proxycache;

        # 缓存有效期：10分钟后可触发验证（平衡实时性与带宽）
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 5m;

        # 关键三件套：实现"先返回旧数据+后台更新"
        proxy_cache_revalidate on;                    # 过期后用条件请求验证
        proxy_cache_background_update on;             # 后台异步更新，不阻塞响应
        proxy_cache_use_stale updating error timeout; # 更新中/出错时仍返回旧缓存

        # 防止缓存击穿（多个相同请求只放行一个回源）
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;

        # 可选：如果源站缓存策略可靠，注释掉下面这行，尊重源站控制
        proxy_ignore_headers Cache-Control Vary;

        # 缓存头，便于调试
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Cache-Expires $sent_http_cache_control;
    }
}
