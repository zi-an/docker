proxy_cache_path proxycache levels=1:2 keys_zone=proxycache:10m max_size=5g inactive=30d use_temp_path=off;

map "$target_host$target_uri" $final_host {
        "~^(.*)\.skt.*Application" $1.com;
        default $target_host;
    }
server {
        listen 88;

        # ==================== 2. 配置本地 DNS 解析器 ====================
        # 动态解析域名必须配置 resolver。此处使用主流公共 DNS
        # ipv6=off 可以避免不必要的 IPv6 解析等待，提升响应速度
        resolver 223.5.5.5 valid=300s ipv6=off;
        resolver_timeout 5s;

        # ==================== 3. 主页面反向代理（含动态域名替换） ====================
        location / {
                proxy_pass https://sukebei.moonchan.xyz;

                proxy_ssl_server_name on;
                proxy_ssl_verify off;

                # ---------------- 核心：域名动态替换 ----------------
                # 必须关掉后端的 Gzip 压缩，否则 Nginx 无法解析并替换 HTML 文本内容
                proxy_set_header Accept-Encoding "";

                # 启用文本替换（按顺序执行）
                sub_filter_once off;
                sub_filter 'https://' 'http://$http_host/proxy/';
                sub_filter 'http://' 'http://$http_host/proxy/';
                sub_filter '/upload/' '/upload/en/';
                sub_filter '//localhost' '';

                # ---------------- 主页面缓存核心配置 ----------------
                proxy_cache proxycache;
                proxy_cache_valid 200 10m;
                proxy_cache_valid 404 5m;

                # 关键三件套：实现"先返回旧数据+后台更新"
                proxy_cache_revalidate on; # 过期后用条件请求验证
                proxy_cache_background_update on; # 后台异步更新，不阻塞响应
                proxy_cache_use_stale updating error timeout; # 更新中/出错时仍返回旧缓存

                # 防止缓存击穿（多个相同请求只放行一个回源）
                proxy_cache_lock on;
                proxy_cache_lock_timeout 3s;

                # 可选：如果源站缓存策略可靠，注释掉下面这行，尊重源站控制
                proxy_ignore_headers Cache-Control Vary;

                # 缓存头，便于调试
                add_header X-Cache-Status $upstream_cache_status;
                add_header X-Cache-Expires $sent_http_cache_control;
        }
        location ~ ^/proxy/([^/]+)/(.*)$ {

                set $target_host $1;
                set $target_uri $2;
                sub_filter_once off;
                sub_filter 'https://' '/proxy/';
                sub_filter 'http://' '/proxy/';

                # 在 location / 块中添加以下内容（第26行之后）
                # 禁用内联JS

sub_filter '.com/' '.skt/';
sub_filter '/upload/assets/' '';

                # 动态拼装真实的请求地址，Nginx 会强制使用 resolver 实时解析 DNS
                proxy_pass https://$final_host/$target_uri$is_args$args;

                # 动态伪造 Host 头和 Referer，防止目标网站防盗链拒绝访问
                proxy_set_header Host $final_host;
                proxy_set_header Referer "https://$final_host";
                proxy_set_header Accept-Encoding "";

                # 开启 SSL 握手支持，确保能顺利请求 https 外部资源
                proxy_ssl_server_name on;
                proxy_ssl_verify off;

                # ---------------- 强行本地静态资源缓存 ----------------
                proxy_cache proxycache;

                # 外部图片、CSS、JS 等静态资源，强行在本地缓存 7 天
                proxy_cache_valid 200 7d;
                proxy_cache_valid 404 1h;

                # 必须忽略源站的禁止缓存头，强制在 10.0.0.6 本地缓存
                proxy_ignore_headers Cache-Control Vary Set-Cookie;
                proxy_hide_header Set-Cookie;

                # 继承和沿用高效缓存更新策略
                proxy_cache_revalidate on;
                proxy_cache_background_update on;
                proxy_cache_use_stale updating error timeout;
                proxy_cache_lock on;
                proxy_cache_lock_timeout 3s;

                # 调试头：方便在浏览器 F12 中观察是哪个外链域名命中了 Nginx 本地缓存
                add_header X-Cache-Status-Dynamic "HIT from $final_host";
                add_header X-Cache-Status $upstream_cache_status;
        }
}