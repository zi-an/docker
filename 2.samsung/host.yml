# https://docs.docker.com/reference/compose-file/version-and-name/
# debian13使用docker26-https://github.com/docker/compose/releases/tag/v2.27.3
# https://mirrors.aliyun.com/docker-ce/win/static/stable/x86_64/
name: lenovo

x-common: &common
  network_mode: bridge
  restart: always
  tty: true

services:

  frp:
    <<: *common
    container_name: frp
    image: frp0.61

  zian:
    <<: *common
    container_name: zian
    hostname: zian.mm
    image: zian
    ports:
      - "80-99:80-99"
      - "443:443"
    volumes:
      - /home/nginx/:/home/nginx/
      - /home/webdav:/var/www/webdav
      - /etc/profile.d/mybash.sh:/etc/profile.d/mybash.sh
    working_dir: /home/nginx
    command: sh -c "nginx & goweb"
# nginx -s reload

  quic:
    <<: *common
    container_name: quic
    hostname: quic.mm
    image: nginx.quic
    ports:
      - "443:443/udp"
    command: sh -c "nginx & bash"

  chronyd:
    <<: *common
    container_name: chronyd
    hostname: chronyd.mm
    image: chronyd4.3
    ports:
      - "123:123/udp"
      - "323:323/udp"

  vlmcsd:
    <<: *common
    container_name: vlmcsd
    hostname: vlmcsd.mm
    image: vlmcsd1113
    ports:
      - "0.0.0.0:1688:1688"

  dnsmasq:
    <<: *common
    container_name: dnsmasq
    hostname: dnsmasq.mm
    image: dnsmasq2.91
    volumes:
      - /etc/hosts:/etc/hosts
    ports:
      - "53:53/udp"

  ollama:
    <<: *common
    container_name: ollama
    hostname: ollama.service
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - /home/ollama/.ollama/:/root/.ollama/
    environment:
      - OLLAMA_KEEP_ALIVE=-1
