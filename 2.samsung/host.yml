version: "3.8"

services:
  zian:
    container_name: zian
    hostname: zian.mm
    image: zian
    restart: always
    tty: true
    ports:
      - "80-88:80-88"
      - "5005:5005"
    volumes:
      - /home/nginx/:/home/nginx/
      - /home/webdav:/var/www/webdav
    working_dir: /home/nginx
    command: sh -c "nginx & goweb"
# mv /etc/nginx/sites-enabled/88.conf /etc/nginx/sites-enabled/80.conf
# sed -i "s|listen 88|listen 80|g" /etc/nginx/sites-enabled/80.conf
# nginx -s reload

  quic:
    container_name: quic
    hostname: quic.mm
    image: nginx.quic
    restart: always
    tty: true
    ports:
      - "443:443/udp"
    command: sh -c "nginx & bash"

  chronyd:
    container_name: chronyd
    hostname: chronyd.mm
    image: chronyd4.3
    restart: always
    tty: true
    ports:
      - "123:123/udp"
      - "323:323/udp"

  vlmcsd:
    container_name: vlmcsd
    hostname: vlmcsd.mm
    image: vlmcsd1113
    tty: true
    ports:
      - "1688:1688"

  dnsmasq:
    container_name: dnsmasq
    hostname: dnsmasq.mm
    image: dnsmasq2.89
    tty: true
    volumes:
      - /etc/hosts:/etc/hosts
    ports:
      - "53:53/udp"

  v2raya:
    container_name: v2raya
    hostname: v2raya.mm
    image: mzz2017/v2raya
    tty: true
    ports:
      - "10086:20172"
      - "2017:2017"
    environment:
      V2RAYA_V2RAY_BIN: /usr/local/bin/v2ray
    volumes:
      - /home/v2raya:/etc/v2raya
# 需指定V2RAYA_V2RAY_BIN才能使用多路
# https://www.freeclashnode.com/uploads/2024/12/0-20241222.txt
# https://v2rayshare.githubrowcontent.com/2024/12/20241222.txt
# 需在设置开启端口分享