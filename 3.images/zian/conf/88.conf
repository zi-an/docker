server {
listen 88;
charset 'utf-8';
root /var/www/autoindex;
client_max_body_size 8192m;
location /json/{autoindex on;autoindex_format json;alias /home/nginx/;}
location /post {proxy_pass http://127.0.0.1:8888;}
location /noter {proxy_pass http://127.0.0.1:8888;}
location /m3u8er {proxy_pass http://127.0.0.1:8888;}
location /get {proxy_pass http://127.0.0.1:8888;proxy_set_header X-Real-IP $remote_addr;}
location / {set $index index.html;
  if ( $arg_from = /m3u8/ ) {set $index m3u8.html;}
  if ( $arg_from = /note/ ) {set $index note.html;}
  index $index;}
}